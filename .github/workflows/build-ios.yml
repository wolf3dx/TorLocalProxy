# Сборка и проверка приложения под iOS.
#
# Зачем это здесь. Собрать что-либо под Apple с Windows нельзя, а Mac у
# нас нет — macOS-раннер GitHub единственная площадка, где это возможно.
# Основной репозиторий проекта на GitLab; сюда код попадает только для
# сборки.
#
# Главное в этом файле — не сборка, а проверка. Симулятор iOS работает
# на сетевом стеке самого раннера, поэтому прокси, поднятый приложением
# внутри симулятора, слушает тот же localhost, что виден снаружи. Значит
# после запуска можно честно спросить у check.torproject.org, идёт ли
# трафик через Tor, и получить ответ, а не предположение.
#
# Мосты в проверке не участвуют: раннер стоит в дата-центре, где Tor не
# заблокирован, и прямого подключения достаточно. Разбор мостов и obfs4 —
# общий с Android код, проверенный там на живой сети.
#
# Имена переменных оболочки только латиницей: русские буквы в именах
# bash не принимает (проверено на своей шкуре в этом же проекте).

name: Сборка iOS

on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  simulator:
    name: Симулятор — собрать и проверить в работе
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: Source/*/go.sum

      - name: Поставить fyne
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Сертификат для сборки без учётной записи Apple
        working-directory: Source/app
        run: |
          chmod +x ci-fake-cert.sh
          ./ci-fake-cert.sh

      - name: Собрать под симулятор
        working-directory: Source/app
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x build-ios.sh fetch-tor-ios.sh
          ./build-ios.sh simulator

      - name: Поднять симулятор
        run: |
          # Модель нам безразлична, важен работающий iOS. jq на раннерах
          # macOS есть из коробки.
          device=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          if [ -z "$device" ] || [ "$device" = "null" ]; then
            echo "подходящего iPhone в симуляторе не нашлось" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "устройство: $device"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device"

      - name: Установить и запустить
        working-directory: Source/app
        run: |
          xcrun simctl install "$DEVICE" TorLocalProxy.app
          # TORPROXY_AUTOCONNECT заставляет приложение подключиться само,
          # без нажатия кнопки: нажимать её в CI некому.
          #
          # Переменные окружения приложению передаются не флагом, а
          # префиксом SIMCTL_CHILD_ у переменной самого simctl. Флаг
          # --setenv этот simctl не понимает и отвечает «Invalid device:
          # --setenv», приняв его за имя устройства.
          SIMCTL_CHILD_TORPROXY_AUTOCONNECT=1 \
            xcrun simctl launch --terminate-running-process \
            "$DEVICE" com.vkandreevich.torlocalproxy

      - name: Дождаться прокси и спросить у сети
        run: |
          # Порт поднимается почти сразу, а подключение к сети Tor
          # занимает от десятков секунд до минут.
          for try in $(seq 1 30); do
            if nc -z 127.0.0.1 9050 2>/dev/null; then
              echo "порт 9050 слушает (попытка $try)"
              break
            fi
            sleep 5
          done

          answer=""
          for try in $(seq 1 24); do
            answer=$(curl -s --socks5-hostname 127.0.0.1:9050 --max-time 30 \
              https://check.torproject.org/api/ip || true)
            case "$answer" in
              *'"IsTor":true'*)
                echo "через SOCKS5: $answer"
                break
                ;;
            esac
            sleep 10
          done
          case "$answer" in
            *'"IsTor":true'*) : ;;
            *)
              echo "SOCKS5 через Tor не заработал, последний ответ: $answer" >&2
              exit 1
              ;;
          esac

          # HTTP-прокси — тот, что вписывают в настройки Wi-Fi на iPhone.
          over_http=$(curl -s --proxy http://127.0.0.1:8118 --max-time 60 \
            https://check.torproject.org/api/ip || true)
          echo "через HTTP: $over_http"
          case "$over_http" in
            *'"IsTor":true'*) : ;;
            *)
              echo "HTTP-прокси через Tor не заработал" >&2
              exit 1
              ;;
          esac

      - name: Журнал tor из симулятора
        if: always()
        run: |
          root=$(xcrun simctl get_app_container "$DEVICE" \
            com.vkandreevich.torlocalproxy data 2>/dev/null || true)
          echo "каталог приложения: $root"
          if [ -n "$root" ]; then
            find "$root" -name 'tor.log' -print -exec tail -60 {} \; || true
            find "$root" -name 'torrc' -print -exec cat {} \; || true
          fi
          # Своего окна в CI никто не видит, поэтому жалобы приложения
          # ищем в системном журнале симулятора: туда попадает и NSLog,
          # и стандартный вывод.
          echo "== системный журнал симулятора =="
          xcrun simctl spawn "$DEVICE" log show --last 10m --style compact \
            --predicate 'process CONTAINS "TorLocalProxy"' 2>/dev/null \
            | tail -60 || true

      - name: Забрать сборку
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorLocalProxy-simulator
          path: Source/app/TorLocalProxy.app
          if-no-files-found: warn

  device:
    name: iPhone — неподписанный .ipa
    runs-on: macos-latest
    timeout-minutes: 60
    # Задание независимое: пакет нужен, даже если проверка в симуляторе
    # не прошла, — чтобы поставить его на живой телефон и посмотреть на
    # поведение в фоне, чего симулятор не покажет.

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: Source/*/go.sum

      - name: Поставить fyne
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Сертификат для сборки без учётной записи Apple
        working-directory: Source/app
        run: |
          chmod +x ci-fake-cert.sh
          ./ci-fake-cert.sh

      - name: Собрать под устройство
        working-directory: Source/app
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x build-ios.sh fetch-tor-ios.sh
          ./build-ios.sh device

      - name: Забрать .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorLocalProxy-ios-ipa
          path: Release/*.ipa
          if-no-files-found: warn
