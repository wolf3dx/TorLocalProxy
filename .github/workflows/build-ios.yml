# Сборка и проверка приложения под iOS.
#
# Зачем это здесь. Собрать что-либо под Apple с Windows нельзя, а Mac у
# нас нет — macOS-раннер GitHub единственная площадка, где это возможно.
# Основной репозиторий проекта на GitLab; сюда код попадает только для
# сборки.
#
# Главное в этом файле — не сборка, а проверка. Симулятор iOS работает
# на сетевом стеке самого раннера, поэтому прокси, поднятый приложением
# внутри симулятора, слушает тот же localhost, что виден снаружи. Значит
# после запуска можно честно спросить у check.torproject.org, идёт ли
# трафик через Tor, и получить ответ, а не предположение.
#
# Мосты в проверке не участвуют: раннер стоит в дата-центре, где Tor не
# заблокирован, и прямого подключения достаточно. Разбор мостов и obfs4
# — общий с Android код, проверенный там на живой сети.

name: Сборка iOS

on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  simulator:
    name: Симулятор — собрать и проверить в работе
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: Source/*/go.sum

      - name: Поставить fyne
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Собрать под симулятор
        working-directory: Source/app
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x build-ios.sh fetch-tor-ios.sh
          ./build-ios.sh simulator

      - name: Поднять симулятор
        run: |
          # Берём любое доступное устройство iPhone: точная модель нам
          # безразлична, важен лишь работающий iOS.
          УСТРОЙСТВО=$(xcrun simctl list devices available -j \
            | python3 -c "
import json,sys
данные=json.load(sys.stdin)['devices']
for среда, список in данные.items():
    for у in список:
        if 'iPhone' in у['name']:
            print(у['udid']); raise SystemExit
raise SystemExit('подходящего iPhone в симуляторе не нашлось')")
          echo "устройство: $УСТРОЙСТВО"
          echo "УСТРОЙСТВО=$УСТРОЙСТВО" >> "$GITHUB_ENV"
          xcrun simctl boot "$УСТРОЙСТВО" || true
          xcrun simctl bootstatus "$УСТРОЙСТВО"

      - name: Установить и запустить
        working-directory: Source/app
        run: |
          xcrun simctl install "$УСТРОЙСТВО" TorLocalProxy.app
          # TORPROXY_AUTOCONNECT заставляет приложение подключиться само,
          # без нажатия кнопки: нажимать её в CI некому.
          xcrun simctl launch --console-pty --setenv TORPROXY_AUTOCONNECT=1 \
            "$УСТРОЙСТВО" com.vkandreevich.torlocalproxy > launch.log 2>&1 &
          sleep 10
          cat launch.log || true

      - name: Дождаться прокси и спросить у сети
        run: |
          # Порт 9050 поднимается сразу, а вот подключение к сети Tor
          # через мосты и без них занимает от десятков секунд до минут.
          for попытка in $(seq 1 30); do
            if nc -z 127.0.0.1 9050 2>/dev/null; then
              echo "порт 9050 слушает (попытка $попытка)"
              break
            fi
            sleep 5
          done

          ответ=""
          for попытка in $(seq 1 24); do
            ответ=$(curl -s --socks5-hostname 127.0.0.1:9050 --max-time 30 \
              https://check.torproject.org/api/ip || true)
            case "$ответ" in
              *'"IsTor":true'*) echo "через SOCKS5: $ответ"; break ;;
            esac
            sleep 10
          done
          case "$ответ" in
            *'"IsTor":true'*) : ;;
            *) echo "SOCKS5 через Tor не заработал, последний ответ: $ответ" >&2; exit 1 ;;
          esac

          # HTTP-прокси — тот, что вписывают в настройки Wi-Fi на iPhone.
          через_http=$(curl -s --proxy http://127.0.0.1:8118 --max-time 60 \
            https://check.torproject.org/api/ip || true)
          echo "через HTTP: $через_http"
          case "$через_http" in
            *'"IsTor":true'*) : ;;
            *) echo "HTTP-прокси через Tor не заработал" >&2; exit 1 ;;
          esac

      - name: Журнал tor из симулятора
        if: always()
        run: |
          КОРЕНЬ=$(xcrun simctl get_app_container "$УСТРОЙСТВО" \
            com.vkandreevich.torlocalproxy data 2>/dev/null || true)
          echo "каталог приложения: $КОРЕНЬ"
          if [ -n "$КОРЕНЬ" ]; then
            find "$КОРЕНЬ" -name 'tor.log' -exec sh -c 'echo "== {}"; tail -40 "{}"' \;
            find "$КОРЕНЬ" -name 'torrc' -exec sh -c 'echo "== {}"; cat "{}"' \;
          fi

      - name: Забрать сборку
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorLocalProxy-simulator
          path: |
            Source/app/TorLocalProxy.app
            Source/app/launch.log
          if-no-files-found: warn

  device:
    name: iPhone — неподписанный .ipa
    runs-on: macos-latest
    timeout-minutes: 45
    # Собирается всегда, даже если проверка в симуляторе не прошла:
    # неподписанный пакет всё равно нужен, чтобы поставить его на живой
    # телефон и посмотреть на поведение в фоне — этого симулятор не
    # покажет.
    needs: []

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: Source/*/go.sum

      - name: Поставить fyne
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Собрать под устройство
        working-directory: Source/app
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x build-ios.sh fetch-tor-ios.sh
          ./build-ios.sh device

      - name: Забрать .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorLocalProxy-ios-ipa
          path: Release/*.ipa
          if-no-files-found: warn
