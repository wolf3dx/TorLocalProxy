# Быстрые проверки основного репозитория. Код Go живёт в Source/, поэтому
# каждое задание туда переходит. Модулей два (core и cmd/torproxy), они
# объединены go.work; шаблон ./... из корня рабочего пространства не
# раскрывается, отсюда явный список PKGS.
#
# Разделение с GitHub: родные раннеры Windows и macOS здесь платные, а на
# GitHub бесплатные. Поэтому тесты на трёх ОС и бинарники под все цели
# собираются там (.github/workflows/ci.yml), а тут остаётся быстрый
# заслон на Linux, который срабатывает на каждый push.

stages:
  - check
  - build

variables:
  GO_IMAGE: golang:1.24
  GOPATH: $CI_PROJECT_DIR/.cache/gopath
  GOCACHE: $CI_PROJECT_DIR/.cache/gobuild
  PKGS: "./core/... ./cmd/torproxy/..."

.go:
  image: $GO_IMAGE
  before_script:
    - cd Source
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/gopath/pkg/mod
      - .cache/gobuild

# Тесты не требуют ни сети, ни установленного tor — правило 5.1 плана.
# Всё, что требует, помечается тегом сборки integration и здесь не идёт.
тесты:
  extends: .go
  stage: check
  script:
    - go vet $PKGS
    - go test -count=1 $PKGS

формат:
  extends: .go
  stage: check
  script:
    - test -z "$(gofmt -l core cmd)" || { echo 'gofmt изменил бы файлы:'; gofmt -l core cmd; exit 1; }

# Правило depguard сторожит границу ядра: core не знает о cmd, desktop,
# android и ios (ЛОГИКА.md, раздел 3).
линтер:
  extends: .go
  stage: check
  image: golangci/golangci-lint:v2.6.2
  script:
    - golangci-lint run $PKGS

# Кросс-сборка под все четыре десктопные цели: проверяет, что код
# компилируется не только под Linux, и даёт бинарники прямо из основного
# репозитория. Пока в проекте нет cgo, этого достаточно; с этапа 8
# (go-libtor) настоящие сборки уходят на родные раннеры GitHub.
сборка:
  extends: .go
  stage: build
  script:
    - mkdir -p dist
    - if [ "$GOOS" = "windows" ]; then SUFFIX=".exe"; else SUFFIX=""; fi
    - >-
      go build -trimpath
      -ldflags "-s -w -X gitlab.com/vkandreevich/torlocalproxy/core.Version=$CI_COMMIT_REF_NAME -X gitlab.com/vkandreevich/torlocalproxy/core.Commit=$CI_COMMIT_SHORT_SHA"
      -o "dist/torproxy-$GOOS-$GOARCH$SUFFIX" ./cmd/torproxy
  parallel:
    matrix:
      - GOOS: windows
        GOARCH: amd64
      - GOOS: linux
        GOARCH: amd64
      - GOOS: darwin
        GOARCH: amd64
      - GOOS: darwin
        GOARCH: arm64
  artifacts:
    name: torproxy-$CI_COMMIT_SHORT_SHA
    paths:
      - Source/dist/
    expire_in: 1 week
